<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="pg" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#f7ecd0"/><stop offset="1" stop-color="#e2cc9c"/></radialGradient>
    <filter id="sh"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#3a2410" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1000" height="640" fill="#24160d"/>
  <rect x="14" y="14" width="972" height="612" rx="6" fill="url(#pg)" stroke="#6b4a2a"/>
  <rect x="24" y="24" width="952" height="592" rx="4" fill="none" stroke="#6e1a17" stroke-opacity=".5"/>

  <text x="500" y="62" text-anchor="middle" font-size="30" font-weight="bold" fill="#6e1a17" letter-spacing="3">LIBRO DE HEROES · MAPA DA APP</text>
  <text x="500" y="86" text-anchor="middle" font-size="14" font-style="italic" fill="#5b4631">Un só ficheiro HTML · sen servidor · en galego · pensado para iPad e móbil · versión 3</text>

  <!-- centro: a folla -->
  <g filter="url(#sh)">
    <rect x="330" y="230" width="340" height="190" rx="10" fill="#fff8e6" stroke="#6e1a17" stroke-width="2"/>
  </g>
  <text x="500" y="262" text-anchor="middle" font-size="19" font-weight="bold" fill="#6e1a17" letter-spacing="2">A FOLLA DO HEROE</text>
  <text x="500" y="282" text-anchor="middle" font-size="12" font-style="italic" fill="#5b4631">seis lapelas · gardado automático · varios personaxes</text>
  <g font-size="13" fill="#2b1d12">
    <g transform="translate(350,300)">
      <rect width="95" height="46" rx="6" fill="#6e1a17"/><text x="47" y="20" text-anchor="middle" fill="#f7e9c9" font-weight="bold">Á mesa</text><text x="47" y="36" text-anchor="middle" fill="#f0d8b8" font-size="10">todo nunha pantalla</text>
    </g>
    <g transform="translate(452,300)">
      <rect width="95" height="46" rx="6" fill="#eddcb3" stroke="#6e1a17"/><text x="47" y="20" text-anchor="middle" font-weight="bold">Personaxe</text><text x="47" y="36" text-anchor="middle" font-size="10">características, compañeiros</text>
    </g>
    <g transform="translate(554,300)">
      <rect width="95" height="46" rx="6" fill="#eddcb3" stroke="#6e1a17"/><text x="47" y="20" text-anchor="middle" font-weight="bold">Combate</text><text x="47" y="36" text-anchor="middle" font-size="10">vida, ataques, estados</text>
    </g>
    <g transform="translate(350,356)">
      <rect width="95" height="46" rx="6" fill="#eddcb3" stroke="#6e1a17"/><text x="47" y="20" text-anchor="middle" font-weight="bold">Grimorio</text><text x="47" y="36" text-anchor="middle" font-size="10">conxuros e espazos</text>
    </g>
    <g transform="translate(452,356)">
      <rect width="95" height="46" rx="6" fill="#eddcb3" stroke="#6e1a17"/><text x="47" y="20" text-anchor="middle" font-weight="bold">Alforxa</text><text x="47" y="36" text-anchor="middle" font-size="10">moedas e equipo</text>
    </g>
    <g transform="translate(554,356)">
      <rect width="95" height="46" rx="6" fill="#eddcb3" stroke="#6e1a17"/><text x="47" y="20" text-anchor="middle" font-weight="bold">Crónica</text><text x="47" y="36" text-anchor="middle" font-size="10">historia e diario</text>
    </g>
  </g>

  <!-- liñas -->
  <g stroke="#6e1a17" stroke-width="1.5" fill="none" stroke-dasharray="4 3" opacity=".7">
    <path d="M330 325 L215 200"/><path d="M330 380 L215 460"/><path d="M670 325 L785 200"/><path d="M670 380 L785 460"/>
    <path d="M500 230 L500 170"/><path d="M500 420 L500 490"/>
    <path d="M330 300 L150 320"/><path d="M670 300 L850 320"/>
  </g>

  <!-- satélites -->
  <g font-size="12" fill="#2b1d12">
    <!-- Máster -->
    <g transform="translate(60,120)" filter="url(#sh)"><rect width="230" height="96" rx="8" fill="#fff8e6" stroke="#a47a2a" stroke-width="1.5"/></g>
    <g transform="translate(60,120)"><text x="115" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#6e1a17">♛ Mesa do máster</text>
      <text x="14" y="44">• Iniciativa, roldas e PV de todos</text><text x="14" y="60">• Bestiario: 32 criaturas con ataques</text><text x="14" y="76">• Xeradores: nomes, PNX, tabernas, botín</text><text x="14" y="90">• Ambiente sonoro sintetizado</text></g>
    <!-- Mapas -->
    <g transform="translate(60,420)" filter="url(#sh)"><rect width="230" height="96" rx="8" fill="#fff8e6" stroke="#a47a2a" stroke-width="1.5"/></g>
    <g transform="translate(60,420)"><text x="115" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#6e1a17">🗺 Mapas</text>
      <text x="14" y="44">• Mazmorra: editor e xerador ao chou</text><text x="14" y="60">• Taboleiro: néboa de guerra e fichas</text><text x="14" y="76">• Campaña: mapa con lugares e notas</text><text x="14" y="90" font-style="italic" fill="#5b4631">exporta PNG · leva a mazmorra ao taboleiro</text></g>
    <!-- Biblioteca -->
    <g transform="translate(710,120)" filter="url(#sh)"><rect width="230" height="96" rx="8" fill="#fff8e6" stroke="#a47a2a" stroke-width="1.5"/></g>
    <g transform="translate(710,120)"><text x="115" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#6e1a17">📖 Biblioteca</text>
      <text x="14" y="44">• Os teus manuais en PDF</text><text x="14" y="60">• Buscador de texto e marcadores</text><text x="14" y="76">• «Referencia no manual» en conxuros</text><text x="14" y="90">  e ataques: abre a páxina exacta</text></g>
    <!-- Grupo e cartas -->
    <g transform="translate(710,420)" filter="url(#sh)"><rect width="230" height="96" rx="8" fill="#fff8e6" stroke="#a47a2a" stroke-width="1.5"/></g>
    <g transform="translate(710,420)"><text x="115" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#6e1a17">⚑ Grupo e cartas</text>
      <text x="14" y="44">• Folla do grupo: heroes, cofre, misións</text><text x="14" y="60">• Cartas imprimibles 63×88 mm</text><text x="14" y="76">• PDF da folla en catro páxinas A4</text><text x="14" y="90">• Copia de seguridade en JSON</text></g>
    <!-- Retrato -->
    <g transform="translate(20,280)" filter="url(#sh)"><rect width="130" height="80" rx="8" fill="#fff8e6" stroke="#a47a2a" stroke-width="1.5"/></g>
    <g transform="translate(20,280)"><text x="65" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#6e1a17">☺ Retrato</text>
      <text x="10" y="42">por capas, cómic</text><text x="10" y="57">10 especies, roupa</text><text x="10" y="72">por clase, ficha PNG</text></g>
    <!-- Dados -->
    <g transform="translate(850,280)" filter="url(#sh)"><rect width="130" height="80" rx="8" fill="#fff8e6" stroke="#a47a2a" stroke-width="1.5"/></g>
    <g transform="translate(850,280)"><text x="65" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#6e1a17">⬢ Dados</text>
      <text x="10" y="42">selo de lacre, ventaxe</text><text x="10" y="57">animación e son</text><text x="10" y="72">tiradas gardadas</text></g>
    <!-- Asistente -->
    <g transform="translate(360,120)" filter="url(#sh)"><rect width="280" height="50" rx="8" fill="#fff8e6" stroke="#a47a2a" stroke-width="1.5"/></g>
    <g transform="translate(360,120)"><text x="140" y="21" text-anchor="middle" font-size="14" font-weight="bold" fill="#6e1a17">✎ Asistente de creación · Subir de nivel</text>
      <text x="140" y="39" text-anchor="middle" font-size="11" font-style="italic" fill="#5b4631">sete pasos con explicacións · PV, dotes e subclase guiados</text></g>
    <!-- Axustes -->
    <g transform="translate(360,490)" filter="url(#sh)"><rect width="280" height="50" rx="8" fill="#fff8e6" stroke="#a47a2a" stroke-width="1.5"/></g>
    <g transform="translate(360,490)"><text x="140" y="21" text-anchor="middle" font-size="14" font-weight="bold" fill="#6e1a17">⚙ Axustes e temas</text>
      <text x="140" y="39" text-anchor="middle" font-size="11" font-style="italic" fill="#5b4631">modo avanzado apagado por defecto · 5 temas</text></g>
  </g>

  <!-- temas -->
  <g transform="translate(300,568)" font-size="11" fill="#2b1d12">
    <text x="200" y="0" text-anchor="middle" font-size="12" font-weight="bold" fill="#6e1a17" letter-spacing="2">CINCO TEMAS</text>
    <g transform="translate(0,10)">
      <rect width="72" height="22" rx="4" fill="#eddcb3" stroke="#6e1a17"/><text x="36" y="15" text-anchor="middle" fill="#6e1a17">Pergameo</text>
      <rect x="82" width="72" height="22" rx="4" fill="#2b2136" stroke="#dba63f"/><text x="118" y="15" text-anchor="middle" fill="#dba63f">Nocturno</text>
      <rect x="164" width="72" height="22" rx="4" fill="#d8dfd7" stroke="#1f2f3f"/><text x="200" y="15" text-anchor="middle" fill="#1f2f3f">Cartógrafo</text>
      <rect x="246" width="72" height="22" rx="4" fill="#fff" stroke="#e0533a"/><text x="282" y="15" text-anchor="middle" fill="#e0533a" font-family="Arial, sans-serif">Moderno</text>
      <rect x="328" width="72" height="22" rx="4" fill="#f7b801" stroke="#111" stroke-width="2"/><text x="364" y="15" text-anchor="middle" fill="#111" font-family="Impact, Arial Black, sans-serif">Cómic</text>
    </g>
  </g>
  <text x="500" y="608" text-anchor="middle" font-size="10" font-style="italic" fill="#5b4631">Regras e compendio baseados no SRD 5.2 (CC BY 4.0). Menú → Mapas · Biblioteca · Grupo · Cartas · Axustes. Botón ♛ → Mesa do máster.</text>
</svg>
